[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "colombia"
version = "2025.2"
requires-python = ">=3.11"
dependencies = [
    "flet==0.23.2",
    "schedule==1.2.2",
    "geopy==2.4.1",
    "python-dotenv==1.0.1",
    "ruff==0.8.6",
    "pre-commit==4.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
