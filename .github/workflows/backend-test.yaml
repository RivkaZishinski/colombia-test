name: 🧪 Test Backend

on:
  workflow_run:
      workflows: ["Build and push"]
      types:
        - completed

  push:
    branches:
      - dev
      - main
      - feature/*
    paths:
      - 'backend/**'

  pull_request:
    branches:
      - dev
      - main
      - feature/*
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: 🐍 Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: ⏬ Install dependencies
      run: |
        pip install --upgrade pip
        pip install .[dev]

    - name: ✅ Run tests
      run: |
        pytest test
