name: 🧪 Test Front

on:
  workflow_run:
      workflows: ["Build and push"]
      types:
        - completed

  push:
    branches:
      - dev
      - main
      - feature/*
    paths:
      - 'front/**'

  pull_request:
    branches:
      - dev
      - main
      - feature/*
    paths:
      - 'front/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front

    steps:
    - name: 📂 Checkout
      uses: actions/checkout@v4

    - name: ⏬ Install dependencies
      run: |
        pip install --upgrade pip
        pip install .[dev]

    - name: ✅ Run tests
      run: |
        pytest test
